<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finanzen" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Haushaltsfinanzen</title>
    <script>
      // Vor dem ersten Rendern, sonst blitzt die App hell auf
      try {
        var t = localStorage.getItem('theme')
        var dunkel = t === 'dunkel' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dunkel) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.backgroundColor = '#171c26'
          var m = document.querySelector('meta[name=theme-color]')
          if (m) m.content = '#11151d'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
