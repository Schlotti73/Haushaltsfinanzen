# Baut das Container-Image und veroeffentlicht es - aber nur, wenn es laeuft.
#
# Ausgeloest vom Versions-Tag, demselben, aus dem auch das Windows-Paket seine
# Nummer zieht (scripts/prod/create_prod_zip.ps1). Beide Wege tragen damit
# dieselbe Version, und die Meldung "v1.5.0 ist verfuegbar" kann nicht fuer die
# eine Plattform stimmen und fuer die andere nicht.
#
# Reihenfolge mit Absicht: bauen, *dann* rauchtesten, erst dann pushen. Ein
# Image, das den Erststart nicht schafft, erreicht die Registry nicht - und
# niemanden, der es sonst als erstes gefunden haette.
#
# Diese Datei laeuft in ZWEI Repositories. Sie liegt im Baum, und der Baum
# wird veroeffentlicht (scripts/prod/veroeffentlichen.ps1) - sie ist drueben
# also dieselbe Datei, und ein Versions-Tag loest sie hier wie dort aus.
# Gepusht wird deshalb nur aus dem oeffentlichen Repository:
#
#   * oeffentlich (Haushaltsfinanzen) - bauen, rauchtesten, nach ghcr.io
#     pushen. Dort haengt das Paket, dort liegt der Quellstand, aus dem es
#     gebaut wurde, und dort liegt das Release mit dem Windows-Paket.
#   * privat (Projekt-Finanzen) - bauen und rauchtesten, nichts pushen. Das
#     ist der Torwaechter *vor* dem Veroeffentlichen: scheitert der Bau, ist
#     noch nichts nach draussen gegangen.
#
# Ohne diese Weiche pushten beide Laeufe dasselbe Paket, und das Paket haenge
# am Repository des letzten Pushs - mal am oeffentlichen, mal am privaten.

name: Docker-Image

on:
  push:
    tags:
      - "v*"
  # Zum Ausprobieren ohne Tag: baut und testet, veroeffentlicht aber nur, wenn
  # "veroeffentlichen" ausdruecklich auf true steht.
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "Image nach dem Test nach ghcr.io pushen"
        type: boolean
        default: false


jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Die vier Actions stehen auf den Hauptnummern, die auf Node 24 laufen
      # (checkout 5+, die Docker-Actions eine Stufe darueber). Die Vorgaenger
      # brachten Node 20 mit, das die Runner nur noch ersatzweise ausfuehren -
      # eine Warnung heute, ein Abbruch, sobald GitHub die Bruecke wegnimmt.
      # Verlangt Runner 2.327.1 oder neuer; ubuntu-latest bei GitHub ist darueber.
      - uses: actions/checkout@v7

      - name: Version und Bildname bestimmen
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "wert=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "wert=dev-$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # Registry-Namen muessen klein geschrieben sein, der Kontoname auf
          # GitHub darf Grossbuchstaben haben ("Schlotti73"). Ungeprueft
          # scheitert der Bau mit "repository name must be lowercase" - und
          # zwar erst beim Exportieren, nach allen teuren Schritten.
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/haushaltsfinanz" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # load statt push: das Image geht erst in den lokalen Daemon, damit der
      # Rauchtest es starten kann. Veroeffentlicht wird es weiter unten.
      - name: Bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.wert }}
          build-args: |
            VERSION=${{ steps.version.outputs.wert }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rauchtest
        run: ./docker/rauchtest.sh "${{ steps.version.outputs.image }}:${{ steps.version.outputs.wert }}"

      # Ab hier nur im oeffentlichen Repository (siehe Kopf): der Lauf auf
      # dem privaten endet mit dem Rauchtest.
      - name: Bei ghcr.io anmelden
        if: github.repository == 'Schlotti73/Haushaltsfinanzen' && (github.ref_type == 'tag' || inputs.veroeffentlichen)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Veroeffentlichen
        if: github.repository == 'Schlotti73/Haushaltsfinanzen' && (github.ref_type == 'tag' || inputs.veroeffentlichen)
        run: |
          docker push "${{ steps.version.outputs.image }}:${{ steps.version.outputs.wert }}"
          # latest nur fuer echte Releases: ein Testlauf darf nicht das sein,
          # was neue Installationen ohne Tag-Angabe ziehen.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag "${{ steps.version.outputs.image }}:${{ steps.version.outputs.wert }}" "${{ steps.version.outputs.image }}:latest"
            docker push "${{ steps.version.outputs.image }}:latest"
          fi

      # Die Zusammenfassung sagt, was der Lauf getan hat - und im privaten
      # Repository heisst das ausdruecklich: nichts veroeffentlicht. Eine
      # Meldung "Image veroeffentlicht" waere dort eine Luege, die man erst
      # beim vergeblichen docker pull bemerkt.
      - name: Zusammenfassung
        run: |
          if [ "${{ github.repository }}" = "Schlotti73/Haushaltsfinanzen" ] \
             && { [ "${{ github.ref_type }}" = "tag" ] || [ "${{ inputs.veroeffentlichen }}" = "true" ]; }; then
            {
              echo "### Image veroeffentlicht"
              echo ""
              echo '```'
              echo "docker pull ${{ steps.version.outputs.image }}:${{ steps.version.outputs.wert }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Gebaut und rauchgetestet, nicht veroeffentlicht"
              echo ""
              echo "Gepusht wird nur aus \`Schlotti73/Haushaltsfinanzen\`; dieser Lauf"
              echo "ist der Torwaechter davor."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
